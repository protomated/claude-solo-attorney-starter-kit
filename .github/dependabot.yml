version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain dependencies for npm — group all into a single PR
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "monthly"
    groups:
      all-dependencies:
        patterns:
          - "*"
